version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build blk.probe is knowledge that belongs to blk.probe. It used to
# live in a consumer's build-disk-probe.sh, which knew the two target
# triples, the cargo profile, where cargo puts things, and how to lipo them
# together. None of that is a consumer's business.
#
# THE TASK IS `binary`, NOT `staticlib`, AND THE DIFFERENCE IS NOT COSMETIC.
# Every sibling library here (rust-fs-*, rust-img-*, rust-disk-partitions) exposes
# `staticlib <out>` and leaves an archive plus headers for a consumer to link.
# This crate produces no archive and no headers. It produces one executable
# that the host app shells out to as a child process. A task called
# `staticlib` would be promising an artifact that does not exist.
#
# THE TOOL IS NAMED blk.probe AND MUST NOT CHANGE ALONE. It was diskprobe,
# then a hyphenated name, and each rename landed in lockstep with the
# consumers that stage it by that name and invoke it by that name. Renaming
# it breaks such a consumer silently: its build succeeds and it reports the
# binary as not found at run time.
#
# THE CARGO TARGET IS blk_probe, AND scripts/stage-binary.sh RENAMES IT.
# Cargo refuses a dot in a target name, so the underscore is a build-system
# constraint that stops at the staging step; what lands in dist/ is
# blk.probe. tests/scripts/test-staged-binary-name.sh builds the target,
# stages it and runs what was staged.
#
# THE OUTPUT IS UNIVERSAL arm64 + x86_64, preserved from the script it
# replaces. It is a single lipo'd file, not two.
# QUIET BY DEFAULT, --verbose ON REQUEST, AND THE BUDGET IS A NUMBER (#17).
#
# Every test tier runs through scripts/tier.sh, which runs it quietly: the
# whole transcript goes to tmp/logs/<tier>.log, a pass prints ONE verdict line
# naming that log, a failure prints one line naming the command's own status,
# and a run that passed but printed more than its budget exits 65 -- a status
# that can be told apart from a failing suite.
#
# THIS SUITE IS NOT LOUD, AND THAT IS WHY THE CONTRACT IS CHEAP TO PUT IN NOW.
# 65 lines for 40 tests is well inside what anybody would want to read. The
# tiers that will not be are the ones coming: an oracle tier comparing this
# probe against blkid (#13) and a fuzz gate (#16). Fitting a wrapper around a
# 65-line suite is a twenty-minute change; fitting one around a 1,500-line
# suite means measuring budgets against a run nobody has read in months.
#
#     tier      measured (2026-09-28)   budget          headroom, and why
#     -------   ---------------------   -------------   -------------------
#     debug     91 lines, 5,084 bytes   125 / 8,000     27% / 36%. A cold
#                                                       `cargo clean && cargo
#                                                       test --locked
#                                                       --all-targets` on an
#                                                       aarch64 Linux host: 18
#                                                       `Compiling` lines for
#                                                       the six sibling crates
#                                                       and their
#                                                       dependencies, then 48
#                                                       test lines across four
#                                                       binaries. THE LINUX
#                                                       NUMBER IS THE LARGER
#                                                       ONE -- tests/oracle_
#                                                       tools.rs compiles only
#                                                       there -- so it is the
#                                                       one measured. The
#                                                       headroom is for a
#                                                       runner that compiles a
#                                                       different dependency
#                                                       set, not for the suite
#                                                       to grow into quietly.
#     release   91 lines, 5,080 bytes   125 / 8,000     the same run with
#                                                       --release; the same
#                                                       shape, so the same
#                                                       budget.
#
# RAISE A BUDGET WITH THE MEASUREMENT THAT JUSTIFIES IT, the way a floor is
# raised, and raise it in .github/workflows/ci.yml in the same breath --
# tests/scripts/test-tier-budgets-agree.sh fails a pull request where the two
# files disagree. A budget nobody can breach measures nothing; one lowered to
# fit a noisy run measures less than nothing.
#
# THE FLOORS ARE THE OTHER HALF. A budget fails a tier that PRINTS too much;
# nothing fails a tier that printed almost nothing because it RAN almost
# nothing. `cargo test` exits 0 on "0 passed; 0 failed", so a build that
# produced no test binary and a full suite report the same green -- and the
# quieter this repository gets, the less anybody would notice. Every tier
# therefore carries an executed-test floor as well, checked by
# scripts/core.sh test-floor from the tier's own log.
#
# THERE IS NO scripts/output-budget.sh HERE, deliberately. The wrapper is
# rust-fs-core's -- this crate already depends on rust-fs-core -- and
# scripts/tier.sh resolves it at run time from the sibling checkout or from
# cargo's answer, verifies it by its `--version` string, and copies it into
# gitignored tmp/ for the run. A committed copy is a copy that drifts; the
# family had several, reached four different ways, with nothing comparing
# them. A present-but-wrong copy is fatal rather than a reason to look
# elsewhere, and tests/scripts/test-tier-wrapper.sh is what proves that.
#
# VERBOSE IS `OUTPUT_BUDGET_VERBOSE=1`, or `chore test:debug -- --verbose`. It
# streams the run and does NOT lift the budget. It is not `FLTH_VERBOSE` any
# more -- that name is simply not read, and setting it fails silently.
vars:
  ARM_TRIPLE: aarch64-apple-darwin
  X86_TRIPLE: x86_64-apple-darwin
  # Cargo names the executable after `[[bin]].name`, not `[package].name`, so
  # the package can be rust-blk-probe while cargo writes
  # target/<triple>/release/blk_probe. TOOLNAME is what the staging step
  # renames it to. See the note above before changing either.
  BINNAME: blk_probe
  TOOLNAME: blk.probe

tasks:
  binary:
    desc: Build the universal arm64+x86_64 CLI binary into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date.
    #
    # THE SIX SIBLING MANIFESTS ARE SOURCES OF OURS, and this is the one place
    # this file differs from its siblings' `staticlib`. Everything this binary
    # does lives in those crates: it links rust-fs-core, four rust-img-* container
    # readers and rust-disk-partitions, all by `path = "../rust-*"`. A version bump
    # in any of them changes that crate's Cargo.toml, and without these lines
    # the fingerprint would still match and a consumer would keep staging a
    # binary built against the old code.
    #
    # THE GAP THAT LEAVES, said out loud: a change to a sibling's `src/` that
    # does NOT bump its version is invisible here. Exact paths are used rather
    # than '../rust-*/src/**/*.rs' because an exact path is the form proven to
    # work across `..` in this project (rust-fs-ext4 ships fs_core.h the same
    # way); a `**` glob across `..` is untested and its failure mode is a
    # pattern that matches nothing, which silently widens the gap instead of
    # closing it. If you can test one, close the gap.
    sources:
      - Cargo.toml
      - Cargo.lock
      - 'src/**/*.rs'
      - '../rust-fs-core/Cargo.toml'
      - '../rust-img-qcow2/Cargo.toml'
      - '../rust-img-vhd/Cargo.toml'
      - '../rust-img-vhdx/Cargo.toml'
      - '../rust-img-vmdk/Cargo.toml'
      - '../rust-disk-partitions/Cargo.toml'

    # Templated, which is fine here where it is not fine above: the check
    # renders these before expanding them, and this is an exact path rather
    # than a glob, so a missing artifact is caught by the pattern failing to
    # match.
    generates:
      - '{{.OUT}}/{{.TOOLNAME}}'

    cmds:
      # Idempotent, and it replaces the consumer having to know the triples:
      # rustup answers "up to date" without touching the network when the
      # target is already installed. It runs here because the triples are ours.
      - 'rustup target add {{.ARM_TRIPLE}}'
      - 'rustup target add {{.X86_TRIPLE}}'
      - 'cargo build --release --target {{.ARM_TRIPLE}}'
      - 'cargo build --release --target {{.X86_TRIPLE}}'
      # One lipo'd file, renamed from the cargo target to the tool's name.
      - >-
        scripts/stage-binary.sh "{{.OUT}}"
        "target/{{.ARM_TRIPLE}}/release/{{.BINNAME}}"
        "target/{{.X86_TRIPLE}}/release/{{.BINNAME}}"
      - 'lipo -info "{{.OUT}}/{{.TOOLNAME}}"'

  build:
    desc: Debug build
    cmds: ['cargo build']

  lint:
    desc: Formatting and clippy, exactly as CI runs them
    # The same two commands every sibling's `lint` runs. This crate
    # could not have this task until the sixteen `improper_ctypes`
    # warnings on the opaque FsCoreDevice handle were scoped away —
    # `-D warnings` turned them into sixteen errors.
    cmds:
      - scripts/agents-core-check.sh
      - task: test:scripts
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here -- a guard that has
    # to be registered somewhere else is a guard that gets silently skipped.
    # CI runs the same loop in the fmt job.
    cmds:
      - |
        set -eu
        for t in tests/scripts/*.sh; do
          echo "== $t"
          bash "$t"
        done

  test:debug:
    desc: The suite in the debug profile, quietly and under a measured budget
    # THE SAME COMMAND CI RUNS, THROUGH THE SAME BUDGET AND THE SAME FLOOR, so
    # a tier that has outgrown either says so here -- before the push --
    # rather than in a CI log nobody was going to read.
    cmds:
      - 'bash scripts/tier.sh "test (debug)" debug 125 8000 -- cargo test --locked --all-targets'
      - |
        # TWO FLOORS, ONE PER PLATFORM, and the reason is tests/oracle_tools.rs:
        # `blkid` and `sfdisk` are util-linux's, so that file is compiled only on
        # Linux and the two platforms genuinely run different numbers of tests. A
        # single number would have to be the smaller one, which is a floor the
        # Linux legs could never breach -- they could lose the whole oracle suite
        # and still pass it.
        if [ "$(uname -s)" = Linux ]; then
          bash scripts/core.sh test-floor debug 61
        else
          bash scripts/core.sh test-floor debug 56
        fi

  test:release:
    desc: The suite in the release profile, which is the one that ships
    # THE PROFILE THE BINARY IS BUILT WITH WAS NEVER TESTED (#13). `binary`
    # above builds --release, and [profile.release] here turns on opt-level 3
    # and LTO; the debug tier runs with debug_assert! bodies live and overflow
    # checks on. An offset computation that panics in one wraps in the other,
    # and the one that wraps is the one a consumer runs.
    cmds:
      - 'bash scripts/tier.sh "test (release)" release 125 8000 -- cargo test --locked --release --all-targets'
      - |
        # TWO FLOORS, ONE PER PLATFORM, and the reason is tests/oracle_tools.rs:
        # `blkid` and `sfdisk` are util-linux's, so that file is compiled only on
        # Linux and the two platforms genuinely run different numbers of tests. A
        # single number would have to be the smaller one, which is a floor the
        # Linux legs could never breach -- they could lose the whole oracle suite
        # and still pass it.
        if [ "$(uname -s)" = Linux ]; then
          bash scripts/core.sh test-floor release 61
        else
          bash scripts/core.sh test-floor release 56
        fi

  test:
    desc: Every test tier, exactly as CI runs them
    cmds:
      - task: test:debug
      - task: test:release

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the built binary (build it first if needed)
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [binary]`. chore prints "task: binary is up to date" on STDOUT,
    # which a caller capturing this as a value receives as part of the value —
    # measured: the capture came back as two lines and `[ -x "$out" ]` failed.
    # A value-returning task returns a value and does nothing else; the caller
    # builds first. PATTERNS.md's shape, arrived at the hard way.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P | tr -d "\n"; printf "/blk.probe\n"'
    vars:
      OUT: 'dist'

  check:ci-gate:
    desc: The one required check stands for every job in ci.yml
    # A chore task naming a script, and nothing else -- the script is what can
    # be tested, reviewed and run without chore at all.
    #
    # This was tests/ci_aggregate_gate.rs. It was the wrong container twice
    # over: it parses a YAML file and compares strings, exercising nothing this
    # crate ships, and as a cargo test it counted towards the executed-test
    # floor the gate itself enforces -- so the suite could satisfy its floor
    # partly by checking its own CI config.
    cmds:
      - bash scripts/core.sh ci-gate