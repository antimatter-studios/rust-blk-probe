name: release

# A pushed version tag publishes the release tarballs: bin/blk.probe and
# LICENSE, one for darwin-arm64 and one for linux-x86_64, each with a .sha256
# and a build-provenance attestation, attached to the GitHub release for the
# tag. Nothing is published to crates.io -- this crate is a tool, and the
# tarballs are what is consumed.
#
# TAGS ARE PUSHED BY A PERSON. Nothing in this repository creates one.
#
# It owns almost nothing itself. The gate is ci.yml, called whole, so a tag is
# held to exactly what a pull request is held to; and the tarball is written
# and checked by the same scripts/package.sh and scripts/check-package.sh
# ci.yml's `package` legs run on every pull request, for the same two
# platforms -- so the first run of this workflow is not the first time the
# packaging ran on either.
#
# tests/scripts/test-release-platforms.sh fails a pull request in which this
# workflow stops packaging, attesting or attaching either platform (#45: the
# first release shipped darwin-arm64 alone, and nothing noticed).
#
# Verify a downloaded tarball with:
#   gh attestation verify rust-blk-probe-<version>-<platform>.tar.gz \
#     --repo antimatter-studios/rust-blk-probe \
#     --signer-workflow antimatter-studios/rust-blk-probe/.github/workflows/release.yml
#
# NOT A REQUIRED CHECK AND MUST NEVER BECOME ONE: it has no `pull_request:`
# trigger, so it can never report on a pull request, and a required context
# that never reports reads to GitHub as permanently pending.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # A tag that disagrees with Cargo.toml would publish a tarball whose name
  # and contents name different versions.
  verify-tag:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: compare tag against the manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag and Cargo.toml agree on $version"

  gate:
    name: branch gate
    uses: ./.github/workflows/ci.yml

  # ONE LEG PER PLATFORM, each built natively on a runner of that platform:
  # cross-compiling Rust needs a cross toolchain or an emulator, and neither
  # is worth it for two targets GitHub provides. READ-ONLY: a leg builds,
  # packages and checks its tarball, then hands it on as a workflow artifact,
  # so a failed leg cannot leave a release with one platform on it.
  package:
    name: package / ${{ matrix.platform }}
    needs: [verify-tag, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: clone the sibling crates
        shell: bash
        run: bash scripts/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - name: build the binary the tarball carries
        run: cargo build --locked --release --bin blk_probe
      - name: package it, and check what was packaged
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(bash scripts/package.sh target/release/blk_probe "${GITHUB_REF_NAME#v}" ${{ matrix.platform }} dist)"
          bash scripts/check-package.sh "$tarball"
          # A formula update is a copy of this, not a re-download and re-hash.
          {
            echo "### $(basename "$tarball")"
            echo ""
            echo '```'
            cat "$tarball.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: hand the tarball to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The one job that writes, after every leg has passed. It checks nothing
  # out and builds nothing: it collects the legs' tarballs, re-checks each
  # against its .sha256, signs a build-provenance attestation over them and
  # attaches the tarballs and their checksums to the release.
  publish:
    name: attest and attach the tarballs
    needs: [package]
    runs-on: ubuntu-latest
    # The only job with a write grant, because it is the only one that needs
    # one: an OIDC token to sign the attestation, the attestation store, and
    # the release the tarballs are attached to.
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: collect every leg's tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: one tarball per platform, each matching its checksum
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          for platform in darwin-arm64 linux-x86_64; do
            tarball="rust-blk-probe-${GITHUB_REF_NAME#v}-$platform.tar.gz"
            if [ ! -f "$tarball" ] || [ ! -f "$tarball.sha256" ]; then
              echo "::error::no $tarball with its .sha256; found: $(ls -A | tr '\n' ' ')"
              exit 1
            fi
            shasum -a 256 -c "$tarball.sha256"
          done
          count="$(ls -1 ./*.tar.gz | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 tarballs, one per package leg, found $count: $(ls -A | tr '\n' ' ')"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # Idempotent: a re-run of a tag whose upload succeeded replaces the
      # assets rather than failing on them.
      - name: attach the tarballs to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md. Each tarball holds bin/blk.probe and LICENSE, for the platform its name gives, with a .sha256 and a build-provenance attestation from this repository's release workflow."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
