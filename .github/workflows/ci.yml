name: CI

# This crate had no CI at all. It could not have had a working one until
# now: the family's gate is `clippy --locked --all-targets -- -D warnings`,
# and sixteen `improper_ctypes` warnings on the opaque FsCoreDevice handle
# turned that into sixteen hard errors. Scoping an allow to the extern
# block was the prerequisite, not a tidy-up.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this whole workflow as its gate, so a tag is held to
  # exactly what a pull request is held to -- one definition, not two copies
  # that drift.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # AND aarch64 LINUX, which is where `c_char` is UNSIGNED.
        #
        # It is signed on both of the other two, so a cast that is real
        # on them is a no-op here and `clippy -D warnings` refuses it.
        # That failure existed on `main` and neither gated target could
        # see it: the repository's own guard refused every commit on an
        # ARM Linux machine over a lint nothing in CI could reproduce
        # (#15). A target that finds a class of defect is a target worth
        # gating rather than trusting.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Six path dependencies, each pinned to a released tag rather than
      # a branch, so a sibling's main moving cannot change what this
      # crate was tested against. Matches the versions in Cargo.toml.
      - name: clone the sibling crates
        shell: bash
        # THE PINS ARE IN scripts/clone-siblings.sh, which is the only place
        # they are written. They used to be spelled out in both ci.yml and
        # fuzz.yml, and a pin in two places is a pin that moves in one of
        # them (#27).
        run: bash scripts/clone-siblings.sh

      # THE ORACLE TESTS WRITE THEIR OWN XFS, BTRFS AND EROFS IMAGES, with
      # each format's own mkfs, because mkfs.xfs refuses anything under
      # 300 MiB and that is no size for a committed seed. blkid and sfdisk are
      # already on every Linux runner; these three are not all there, and
      # tests/oracle_tools.rs fails naming the package when one is missing
      # rather than skipping. macOS does not compile that file.
      - name: install the mkfs tools the oracle tests write images with
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xfsprogs btrfs-progs erofs-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --locked --all-targets

      # THE TIERS RUN THROUGH scripts/tier.sh, WITH THE NUMBERS chores.yml
      # HAS. The workflow cannot read chores.yml without installing chore on
      # three runner platforms, so the budgets and floors are repeated here --
      # and tests/scripts/test-tier-budgets-agree.sh fails a pull request in
      # which the two files disagree. Raise a budget in both or in neither.
      #
      # `shell: bash` on every leg, because the tier scripts are bash and
      # macos-latest is not where that is in question -- it is the default on
      # all three, and saying so keeps it that way if a leg is ever added.
      - name: test (debug)
        shell: bash
        run: |
          bash scripts/tier.sh "test (debug)" debug 125 8000 -- cargo test --locked --all-targets
          # TWO FLOORS, ONE PER PLATFORM, and the reason is
          # tests/oracle_tools.rs: `blkid` and `sfdisk` are util-linux's, so
          # that file is compiled only on Linux and the two platforms run
          # different numbers of tests. A single number would have to be the
          # smaller one, which is a floor the Linux legs could never breach.
          if [ "$(uname -s)" = Linux ]; then
            bash scripts/core.sh test-floor debug 61
          else
            bash scripts/core.sh test-floor debug 56
          fi

      # THE PROFILE THAT SHIPS. `chore binary` builds --release with
      # opt-level 3 and LTO; every test above this line ran with debug_assert!
      # bodies live and overflow checks on. An offset computation that panics
      # in one wraps in the other (#13), so both profiles are run.
      - name: test (release)
        shell: bash
        run: |
          bash scripts/tier.sh "test (release)" release 125 8000 -- cargo test --locked --release --all-targets
          # TWO FLOORS, ONE PER PLATFORM, and the reason is
          # tests/oracle_tools.rs: `blkid` and `sfdisk` are util-linux's, so
          # that file is compiled only on Linux and the two platforms run
          # different numbers of tests. A single number would have to be the
          # smaller one, which is a floor the Linux legs could never breach.
          if [ "$(uname -s)" = Linux ]; then
            bash scripts/core.sh test-floor release 61
          else
            bash scripts/core.sh test-floor release 56
          fi

      # A quiet tier keeps everything; it just does not print it. Without this
      # the transcript of a failing run dies with the runner, and the one-line
      # verdict a failure prints names a log nobody can fetch. `if: always()`
      # because the run worth keeping is the one that failed.
      - name: keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt
        run: cargo fmt --check
      - name: the one required check stands for every job
        run: bash scripts/core.sh ci-gate
      - name: the agent guide carries the shared block
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: scripts/agents-core-check.sh
      # rust-fs-core OWNS output-budget.sh, and test-tier-wrapper.sh drives
      # tier.sh against the real one rather than a stand-in, so this job
      # needs that sibling beside it too -- at the same pin the test matrix
      # uses, which is why it goes through scripts/clone-siblings.sh rather
      # than cloning rust-fs-core itself. Without it the guard fails naming
      # rust-fs-core, which is the guard working, not a reason to skip it.
      - name: clone the sibling crates
        shell: bash
        run: bash scripts/clone-siblings.sh
      # The shell tests, by glob, so a guard added later needs no edit here.
      - name: script tests (tests/scripts/*.sh)
        run: |
          set -euo pipefail
          for t in tests/scripts/*.sh; do
            echo "== $t"
            bash "$t"
          done
      # The family scripts are rust-fs-core's alone: this fails if a copy of
      # one is committed here, scripts/core.sh differs from core's, or
      # anything here still calls a local copy.
      - name: no copy of a rust-fs-core family script
        shell: bash
        run: bash scripts/core.sh family-check

  # THE TARBALLS A RELEASE WOULD PUBLISH, BUILT ON EVERY PULL REQUEST. The
  # release path runs only on a tag, which is the one moment nobody wants to
  # find out that packaging broke. So the same two scripts release.yml runs --
  # scripts/package.sh, then scripts/check-package.sh -- run here, once per
  # platform a release ships, each on a runner that builds it natively, over
  # the release profile that ships. Nothing is attested or uploaded from a
  # pull request; the tarballs are kept as artifacts so they can be
  # inspected. tests/scripts/test-release-platforms.sh fails a pull request
  # that drops a platform from these legs or from release.yml's (#45).
  package:
    name: package / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: clone the sibling crates
        shell: bash
        run: bash scripts/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build the binary the tarball carries
        run: cargo build --locked --release --bin blk_probe
      - name: package it, and check what was packaged
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          tarball="$(bash scripts/package.sh target/release/blk_probe "$version" ${{ matrix.platform }} dist)"
          bash scripts/check-package.sh "$tarball"
      - name: keep the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK (#18). Branch protection names this job and no
    # other, so the two jobs above can be renamed, split or grown a leg
    # without leaving a required context that never reports — which GitHub
    # reads as permanently pending, and with `enforce_admins` on that is an
    # unbreakable block with no failure to point at.
    #
    #   test   the matrix: `cargo build`, `cargo test` and
    #          `clippy -D warnings` on ubuntu-latest, ubuntu-24.04-arm and
    #          macos-latest, each against the six sibling crates cloned at
    #          their pinned tags.
    #          `needs:` names the JOB, not its legs, so adding an
    #          `ubuntu-24.04-arm` leg — which #15 needs, because the
    #          `unnecessary_cast` it reports is invisible to both current
    #          targets — is waited on the moment it exists, with no second
    #          edit here and none in `.github-guard`.
    #   fmt    `cargo fmt --check`, once: the same answer on every platform,
    #          so it is not a matrix leg.
    #   package  the release tarballs for darwin-arm64 and linux-x86_64,
    #          built and checked the way release.yml builds and checks them.
    #
    # `if: always()` is what makes it a gate rather than a summary. Without
    # it a cancelled or skipped dependency leaves this job skipped too, and a
    # skipped required check is indistinguishable from an absent one.
    if: always()
    needs: [test, fmt, package]
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # SKIPPED FAILS, and so does cancelled. A job that did not run is
          # not a job that passed: `test` reaches for six sibling clones and
          # a toolchain, and every way that can go wrong ends in a result
          # this line has to refuse rather than wave through.
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all gating jobs succeeded"
