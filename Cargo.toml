[package]
name = "rust-blk-probe"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "CLI: open a disk image (raw or qcow2/vhd/vhdx/vmdk container), probe its partition table, emit JSON."

# THE LIBRARY IS WHERE THE PROBE LIVES, and the binary is a front for it.
# Nothing links this crate -- `chore binary` is its interface and there is no
# `staticlib` task -- but a probe that cannot be called except by running a
# process cannot be fuzzed, cannot be compared against `blkid` from an
# integration test, and could only ever be unit-tested from inside its own
# `main.rs` (#16).
#
# THE LIB NAME IS `blk_probe` AND IS SET EXPLICITLY. Left to cargo it would be
# `rust_blk_probe`, after the package; the binary target and the crate a test
# says `use blk_probe::` to are the same word, and the package name is the
# odd one out.
[lib]
name = "blk_probe"
path = "src/lib.rs"

# THE TOOL IS `blk.probe`, AND THIS TARGET IS `blk_probe` ONLY BECAUSE CARGO
# REFUSES A DOT in a target name ("invalid character '.' in crate name").
# scripts/stage-binary.sh renames it on the way out, so the underscore never
# reaches anybody who runs the tool, and there is no hyphenated spelling at
# all. tests/scripts/test-staged-binary-name.sh builds this target, stages
# it and runs what was staged.
[[bin]]
name = "blk_probe"
path = "src/main.rs"

# EACH REQUIREMENT NAMES A RELEASE, NOT A FLOOR (#27). `version = "0.2"` is
# satisfied by everything from 0.2.0 to 0.2.13, so the only thing deciding
# what was built was Cargo.lock -- and it sat at 0.2.6 for seven patch
# releases while the requirement said nothing was wrong. A requirement that
# understates its lock is the shape github-guard's `rust-deps-pinned` caught
# in three sibling repositories during the v0.2.13 sweep.
#
# These are `path` dependencies, so what is compiled is whatever is in
# ../rust-*; the requirement is consulted when publishing and nowhere else.
# The lock beside this file is resolved against the tagged siblings, and
# src/lib.rs zero-initialises `PartitionInfo` rather than naming its fields,
# so a field added on rust-disk-partitions' `main` between releases does not stop
# this building. rust-disk-partitions moved to 0.5.0 in lockstep with the release
# that added `slot`, `issues` and `available_length` (#28).
#
# The refs CI checks out are in scripts/clone-siblings.sh, and
# tests/scripts/test-sibling-pins-agree.sh fails if this list and that one
# stop naming the same six crates.
#
# rust-fs-core's `cli` FEATURE IS ON FOR ONE THING: `blk.probe --version`
# prints the family's identifying line through `fs_core::cli::version`, the
# one place that line is written, rather than a copy of its format here
# (#47). The rest of that module -- multi-call dispatch, JSON errors on
# stderr, exit 2 for a usage error -- is not used, because this tool's exit
# codes are a published contract of their own.
[dependencies]
rust-fs-core = { path = "../rust-fs-core", version = "0.3.3", features = ["cli"] }
rust-img-qcow2 = { path = "../rust-img-qcow2", version = "0.6.0" }
rust-img-vhd = { path = "../rust-img-vhd", version = "0.6.0" }
rust-img-vhdx = { path = "../rust-img-vhdx", version = "0.6.0" }
rust-img-vmdk = { path = "../rust-img-vmdk", version = "0.5.0" }
rust-disk-partitions = { path = "../rust-disk-partitions", version = "0.6.0" }

[profile.release]
opt-level = 3
lto = true
strip = true
